{{- if .Values.externalSecrets.enabled }}
# Pulls every GCP Secret Manager secret named "<remoteKeyPrefix>-<KEY>" and
# projects it into a Kubernetes Secret as bare "KEY" env vars. The pod consumes
# them via envFrom (see deployment.yaml). Requires a ClusterSecretStore named
# "{{ .Values.externalSecrets.storeRef }}" wired to GCP Secret Manager via
# Workload Identity (see infra/gke/02-external-secrets.ps1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "vertofi.name" . }}-secrets
  labels: {{- include "vertofi.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef }}
    kind: ClusterSecretStore
  target:
    name: {{ include "vertofi.name" . }}-secrets
  dataFrom:
    - find:
        name:
          regexp: "^{{ .Values.externalSecrets.remoteKeyPrefix }}-"
      rewrite:
        - regexp:
            source: "{{ .Values.externalSecrets.remoteKeyPrefix }}-(.*)"
            target: "$1"
{{- end }}
