{{- if .Values.serviceAccount.create }}
# Kubernetes ServiceAccount for the pod. When a GCP service account email is
# supplied, the iam.gke.io/gcp-service-account annotation enables GKE Workload
# Identity, so the pod authenticates to GCP APIs (Secret Manager, Cloud SQL,
# GCS) without static keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vertofi.name" . }}
  labels: {{- include "vertofi.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | quote }}
  {{- end }}
{{- end }}
