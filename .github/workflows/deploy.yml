name: Build and Push to Artifact Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

# Repo/Org secrets required:
#   GCP_PROJECT_ID   – your project id
#   GCP_REGION       – e.g. asia-south1
#   GCP_SA_KEY       – JSON key for a CI service account with
#                      roles/artifactregistry.writer (or use Workload Identity
#                      Federation and swap the auth step accordingly)
env:
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ secrets.GCP_SA_KEY != '' && secrets.GCP_PROJECT_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Services
          - name: api-gateway
            type: service
          - name: auth
            type: service
          - name: tenant
            type: service
          - name: access
            type: service
          - name: audit
            type: service
          - name: onboarding
            type: service
          - name: document
            type: service
          - name: billing
            type: service
          - name: ocr
            type: python
          - name: notification
            type: service
          - name: ai-gateway
            type: python
          - name: accounting-ledger
            type: service
          - name: categorization
            type: python
          - name: reconciliation
            type: service
          - name: exception-workflow
            type: service
          - name: bank-connector
            type: service
          - name: gst-connector
            type: service
          - name: accounting-sync
            type: service
          - name: whatsapp
            type: service
          - name: bhs-engine
            type: service
          - name: reporting
            type: service
          - name: prediction
            type: service
          - name: lifeguard
            type: service
          - name: vendor
            type: service
          - name: vbd
            type: service
          - name: legal-cases
            type: service
          - name: bhs-intelligence
            type: service
          - name: benchmarks
            type: service
          - name: warranty
            type: service
          - name: verification-connectors
            type: service
          - name: admin-console
            type: service
          - name: accounting
            type: service
          # Frontends (web-landing/business/panels/admin) deploy to Vercel, not
          # Artifact Registry — see setup-guide/02-GCP-COMPLETE-SETUP.md.

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Service Image
        if: ${{ matrix.type == 'service' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.node
          build-args: |
            SERVICE=${{ matrix.name }}
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/vertofi/${{ matrix.name }}:latest
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/vertofi/${{ matrix.name }}:${{ github.sha }}

      - name: Build and Push Python Service Image
        if: ${{ matrix.type == 'python' }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.name }}
          file: services/${{ matrix.name }}/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/vertofi/${{ matrix.name }}:latest
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/vertofi/${{ matrix.name }}:${{ github.sha }}

      - name: Build and Push App Image
        if: ${{ matrix.type == 'app' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.next
          build-args: |
            APP=${{ matrix.name }}
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/vertofi/${{ matrix.name }}:latest
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/vertofi/${{ matrix.name }}:${{ github.sha }}
