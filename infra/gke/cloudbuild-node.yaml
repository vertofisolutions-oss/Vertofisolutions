# Cloud Build config for a Node/TypeScript service. The build context is the repo
# root; the generic Dockerfile compiles the target service + its workspace deps.
# Invoked per service by build-images.ps1 with _SERVICE and _IMAGE substitutions.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'infra/docker/Dockerfile.node'
      - '--build-arg'
      - 'SERVICE=${_SERVICE}'
      - '-t'
      - '${_IMAGE}'
      - '.'
images:
  - '${_IMAGE}'
options:
  machineType: 'E2_HIGHCPU_8'
timeout: 1800s
