apiVersion: v1
kind: Pod
metadata:
  name: gw-smoke
  namespace: default
spec:
  nodeSelector:
    cloud.google.com/compute-class: vertofi-std
  restartPolicy: Never
  containers:
    - name: gw
      image: asia-south1-docker.pkg.dev/vertofi-prod-001/vertofi/api-gateway:fix1
      resources:
        requests: { cpu: "250m", memory: "512Mi" }
